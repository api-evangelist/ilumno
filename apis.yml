name: Ilumno
description: 'Ilumno is a Latin American education technology company that helps higher education
  institutions grow and modernize through digital transformation. Its services span student acquisition
  and retention (Growth), online and virtual learning platforms (Virtuality), and real-time analytics
  and student-data management tools, all delivered on its Growth Engine technology platform. Ilumno
  reports supporting more than 220,000 students across the region, with offices in Bogota (Colombia),
  Dallas (USA) and Amsterdam (Netherlands). The company is backed by Insight Partners.'
